name: judge test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: install claude cli
        run: npm install -g @anthropic-ai/claude-code
      - name: version
        run: claude --version || true
      - name: token present?
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "token: set (${#CLAUDE_CODE_OAUTH_TOKEN} chars)"; else echo "token: MISSING"; fi
      - name: bare -p call (text)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "--- exit code and streams below ---"
          set +e
          out=$(claude -p "Reply with only this JSON and nothing else: {\"ok\": true}" 2>err.txt)
          rc=$?
          echo "rc=$rc"
          echo "STDOUT: $out"
          echo "STDERR: $(cat err.txt | head -20)"
      - name: -p with json output
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          out=$(claude -p "Say hi" --output-format json 2>err2.txt)
          echo "rc=$?"
          echo "STDOUT: ${out:0:400}"
          echo "STDERR: $(cat err2.txt | head -20)"
