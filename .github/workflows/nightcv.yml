name: night cv
# Manual-only while César measures volume and token cost by hand;
# re-chain to the scrape by restoring the workflow_run trigger.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "tune the data/cvbatch.json allowlist (open tab), not only fresh"
        type: boolean
        default: false
      max:
        description: "max CVs this run (quality pipeline: ~15-20 min per CV)"
        default: "6"
permissions:
  contents: write
concurrency:
  group: nightcv
  cancel-in-progress: false
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cesarxdesign/CV-Tuner
          path: tcv
      - name: install claude cli
        run: npm install -g @anthropic-ai/claude-code
      - name: tune CVs on the subscription
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NIGHTCV_BATCH: ${{ inputs.batch && '1' || '' }}
          NIGHTCV_MAX: ${{ inputs.max }}
        run: python3 nightcv_cloud.py
      - name: push results
        run: |
          git config user.email cesarxdesign@gmail.com
          git config user.name "Cesar Garcia"
          git add data/facts.json data/cvdone.json data/cvs.json cvs/
          git diff --cached --quiet && exit 0
          git commit -m "night run: tuned CVs"
          git pull --rebase --autostash origin main
          git push origin main
