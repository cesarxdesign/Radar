name: rejudge
# Backfill verdicts left on an older prompt, on demand, from a branch.
# CI has the OAuth token and no nested-session problem, so this is the way to
# prove a criteria change before it is merged.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "which roles"
        type: choice
        options: ["--at-risk", "--open"]
        default: "--at-risk"
      dry_run:
        description: "list them without judging"
        type: boolean
        default: false
jobs:
  rejudge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: nightcv          # never race the nightly judge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install claude cli
        run: npm install -g @anthropic-ai/claude-code
      - name: take main's current data
        # the branch carries code, not data - judge against what is live now
        run: |
          git fetch origin main
          git checkout origin/main -- data/
      - name: rejudge
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 rejudge.py ${{ inputs.mode }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: commit verdicts
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Cesar Garcia"
          git config user.email "cesarxdesign@gmail.com"
          git add data/judged.json data/jobs.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "rejudge ${{ inputs.mode }} against prompt v2"
          git push origin HEAD:judge-remote-scope
