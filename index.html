<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobRadar</title>
<style>
:root {
  --bg: #fafaf8; --card: #ffffff; --ink: #1a1a18; --mut: #8a8a84;
  --line: #e8e8e4; --acc: #0a6b48; --amber: #b45309; --amber-bg: #fef3e2;
  --chip: #f1f1ee; --danger: #a33;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --card: #1c1c1a; --ink: #ecece8; --mut: #8f8f88;
    --line: #2a2a27; --acc: #4ade80; --amber: #fbbf24; --amber-bg: #3a2c10;
    --chip: #262623; --danger: #f87171;
  }
}
* { box-sizing: border-box; margin: 0; }
html { overflow-x: clip; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: 40px 20px 120px;
}
.wrap { max-width: 1560px; margin: 0 auto; display: grid;
        grid-template-columns: minmax(430px, 540px) 1fr; gap: 22px; align-items: start; }
.wrap > header, .wrap > .settings, .wrap > .tabs, .wrap > .controls, .wrap > footer { grid-column: 1 / -1; }
#listcol { min-width: 0; }
#preview {
  position: sticky; top: 18px; height: calc(100vh - 36px); min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
}
.pvhead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pvhead b { font-size: 15px; }
.pvhead .co { color: var(--mut); font-size: 13px; }
.pvhead a { margin-left: auto; color: var(--acc); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.pvbody { flex: 1; min-height: 0; display: flex; }
.pvbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.brief { padding: 22px; overflow-y: auto; width: 100%; }
.brief .tiles { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 18px; }
.brief h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--mut); margin: 18px 0 8px; }
.brief ul { padding-left: 18px; font-size: 14px; }
.brief li { margin-bottom: 4px; }
.brief .jd { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; color: var(--ink); opacity: 0.92; }
.brief .goapply {
  display: inline-block; background: var(--acc); color: var(--bg); font-weight: 700;
  border-radius: 9px; padding: 11px 20px; text-decoration: none; margin-bottom: 6px;
}
.brief .noframe { color: var(--mut); font-size: 12px; margin: 6px 0 14px; }
@media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } #preview { display: none; } }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header h1 { line-height: 1; }
h1 { font-size: 22px; letter-spacing: -0.02em; }
.stamp { color: var(--mut); font-size: 13px; flex: 1; }
.gear { background: none; border: 0; color: var(--mut); font-size: 16px; cursor: pointer; }
.tabs { display: flex; gap: 4px; margin: 18px 0 16px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; color: var(--mut); font: 600 14px/1 inherit;
  padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab .n { color: var(--mut); font-weight: 400; margin-left: 4px; }
.scrape {
  background: var(--card); border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font: 600 13px/1 inherit; cursor: pointer;
}
.scrape:hover { border-color: var(--acc); color: var(--acc); }
.scrape[disabled] { opacity: 0.5; cursor: wait; }
h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--mut); margin: 30px 0 10px; display: flex; gap: 8px; align-items: center;
}
h2 .n { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 11px; }
.job {
  display: flex; gap: 14px; align-items: center; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px; margin-bottom: 8px;
  cursor: pointer;
}
.job.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.job { padding: 15px 18px; }
.jrow1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.jrow1 .co { font-weight: 600; }
.jrow1 .hq { color: var(--mut); font-size: 13px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jrow1 .sal { margin-left: auto; }
.jrow2 { display: flex; gap: 26px; margin-top: 10px; flex-wrap: wrap; }
.cell { min-width: 52px; }
.cell i {
  display: block; font-style: normal; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.09em; color: var(--mut); margin-bottom: 2px;
}
.cell b { font-size: 13px; font-weight: 600; color: var(--ink); }
.cell b.dim { color: var(--mut); font-weight: 400; }
.cell b.yes { color: var(--acc); }
.cell b.no { color: var(--danger); }
.cell b.today { color: var(--amber); }
.jmain { flex: 1; min-width: 0; }
.jtitle { font-weight: 600; text-decoration: none; color: var(--ink); }
.jtitle:hover { color: var(--acc); }
.jmeta { color: var(--mut); font-size: 13px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.jmeta .co { color: var(--ink); font-weight: 500; }
.sal { color: var(--acc); font-weight: 600; font-size: 13px; white-space: nowrap; }
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; border-radius: 5px;
  padding: 3px 7px; text-transform: uppercase; white-space: nowrap;
}
.b-new { background: var(--amber-bg); color: var(--amber); }
.b-pt { background: var(--acc); color: var(--bg); }
.b-ok { background: var(--chip); color: var(--acc); }
.jacts { display: flex; gap: 6px; }
.jacts button {
  background: none; border: 1px solid var(--line); color: var(--mut);
  border-radius: 7px; padding: 5px 10px; font: 12px/1 inherit; cursor: pointer; white-space: nowrap;
}
.jacts button:hover { color: var(--ink); border-color: var(--mut); }
.jacts .applied.on { color: var(--acc); border-color: var(--acc); }
.empty { color: var(--mut); padding: 8px 2px 20px; font-size: 14px; }
.settings {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; margin: 16px 0; font-size: 13px; display: none;
}
.settings.open { display: block; }
.settings p { color: var(--mut); margin-bottom: 8px; }
.settings input {
  width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 10px; font: 13px monospace; margin: 4px 0 8px;
}
.settings a { color: var(--acc); }
.settings button { background: var(--ink); color: var(--bg); border: 0; border-radius: 7px; padding: 7px 14px; font: 600 12px/1 inherit; cursor: pointer; }
.sync { color: var(--mut); font-size: 12px; margin-left: 10px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 20px;
  font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw;
}
.toast.show { opacity: 1; }
footer { margin-top: 50px; color: var(--mut); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
footer .bad { color: var(--danger); }
@media (max-width: 640px) {
  .job { flex-wrap: wrap; }
  .jacts { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JobRadar</h1>
    <span class="stamp" id="stamp">loading…</span>
    <button class="scrape" id="scrape">↻ Scrape now</button>
    <button class="gear" id="gear" title="Settings">⚙</button>
  </header>
  <div class="settings" id="settings">
    <p><strong>GitHub token</strong> — enables the Scrape now button. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a fine-grained token</a>:
    repository access <em>only cesarxdesign/jobradar</em>, permissions <em>Contents: read&nbsp;+&nbsp;write</em> and
    <em>Actions: read&nbsp;+&nbsp;write</em>. It never leaves this browser.</p>
    <input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">
    <button id="savetok">Save</button><span class="sync" id="syncmsg"></span>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="direct">Direct<span class="n" id="c-direct"></span></button>
    <button class="tab" data-tab="indirect">Indirect<span class="n" id="c-indirect"></span></button>
    <button class="tab" data-tab="applied">Applied<span class="n" id="c-applied"></span></button>
    <button class="tab" data-tab="discarded">Discarded<span class="n" id="c-discarded"></span></button>
  </nav>
  <main id="listcol"><div id="sections"></div></main>
  <aside id="preview">
    <div class="pvhead">
      <b id="pv-title">—</b><span class="co" id="pv-co"></span>
      <a id="pv-open" href="#" target="_blank" rel="noopener" style="display:none">Open ↗</a>
    </div>
    <div class="pvbody" id="pv-body"><div class="brief"><span class="empty">Select a role on the left.</span></div></div>
  </aside>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const REPO = "cesarxdesign/jobradar";
const LS = "jobradar-v2";
let state = { jobs: {}, verdicts: {}, token: "" };
try {
  const v2 = JSON.parse(localStorage.getItem(LS));
  if (v2) state = Object.assign(state, v2);
  else {
    const v1 = JSON.parse(localStorage.getItem("jobradar-state")) || {};
    for (const id in v1) {
      if (v1[id] === "applied") state.jobs[id] = "applied";
      if (v1[id] === "hidden") state.jobs[id] = "discarded";
    }
  }
} catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

const BUCKET = { pt: "Portugal / Lisbon", eu: "Remote · Europe", ww: "Remote · Worldwide", ok: "OK’d by you", tiebreak: "Unsure" };
let DATA = null, FACTS = {}, JDS = null, tab = "direct";
let SEL = null, PV = null;

// ---------- helpers ----------
function esc(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function when(j) { const t = new Date(j.posted || j.first_seen).getTime(); return isNaN(t) ? 0 : t; }
function days(j) {
  const t = when(j); if (!t) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 864e5));
}
function bucketOf(j) {
  const v = state.verdicts[j.id];
  if (v) return v.v === "y" ? "ok" : "no";
  return j.bucket;
}
function toast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), ms || 2600);
}

// ---------- verdict sync (optional, needs token) ----------
function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
let REPO_STATE = null, stTimer = null;
function scheduleState() { clearTimeout(stTimer); stTimer = setTimeout(pushState, 2000); }
async function pushState() {
  if (!state.token) return;
  const payload = JSON.stringify({ updated: new Date().toISOString(), jobs: state.jobs }, null, 1);
  if (REPO_STATE !== null && JSON.stringify(JSON.parse(REPO_STATE).jobs || {}) === JSON.stringify(state.jobs)) return;
  const url = "https://api.github.com/repos/" + REPO + "/contents/data/state.json";
  try {
    let sha;
    const r = await fetch(url, { headers: ghHeaders() });
    if (r.ok) sha = (await r.json()).sha;
    else if (r.status !== 404) throw new Error("GET " + r.status);
    const body = { message: "triage state from dashboard", content: b64(payload) };
    if (sha) body.sha = sha;
    const put = await fetch(url, { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) });
    if (!put.ok) throw new Error("PUT " + put.status);
    REPO_STATE = payload;
    setSyncMsg("triage synced " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) { setSyncMsg("triage sync failed: " + e.message); }
}
function ghHeaders() {
  return { "Authorization": "Bearer " + state.token, "Accept": "application/vnd.github+json" };
}
function setSyncMsg(m) { document.getElementById("syncmsg").textContent = m; }

// ---------- scrape now ----------
async function scrapeNow() {
  if (!state.token) {
    document.getElementById("settings").classList.add("open");
    toast("Needs the GitHub token — or run it from the repo’s Actions tab");
    return;
  }
  const btn = document.getElementById("scrape");
  btn.disabled = true; btn.textContent = "↻ scraping…";
  try {
    const r = await fetch("https://api.github.com/repos/" + REPO + "/actions/workflows/scrape.yml/dispatches", {
      method: "POST", headers: ghHeaders(), body: JSON.stringify({ ref: "main" })
    });
    if (r.status !== 204) throw new Error("HTTP " + r.status);
    toast("Scrape started — takes ~2 min, page will refresh itself");
    const was = DATA.generated_at;
    const poll = setInterval(async () => {
      try {
        const d = await (await fetch("data/jobs.json?t=" + Date.now())).json();
        if (d.generated_at !== was) {
          clearInterval(poll); DATA = d; stamp(); render();
          btn.disabled = false; btn.textContent = "↻ Scrape now";
          toast("Updated — " + d.counts.new + " new");
        }
      } catch (e) {}
    }, 20000);
    setTimeout(() => { clearInterval(poll); btn.disabled = false; btn.textContent = "↻ Scrape now"; }, 480000);
  } catch (e) {
    btn.disabled = false; btn.textContent = "↻ Scrape now";
    toast("Couldn’t start scrape: " + e.message);
  }
}

// ---------- cards ----------
function selectJob(id) {
  if (SEL === id) return;
  SEL = id;
  render();
}
function renderPreview() {
  const j = SEL && DATA.jobs.find(x => x.id === SEL);
  if (!j || PV === j.id) return;
  PV = j.id;
  const target = safeUrl(j.apply_url || j.url);
  document.getElementById("pv-title").textContent = j.title;
  document.getElementById("pv-co").textContent = j.company;
  const open = document.getElementById("pv-open");
  open.href = target; open.style.display = "";
  const body = document.getElementById("pv-body");
  if (j.frameable) {
    body.innerHTML = '<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" src="' + esc(target) + '"></iframe>';
    return;
  }
  const f = FACTS[j.id] || {};
  const pt = ptSituation(j, f);
  const dd = days(j);
  let h = '<div class="brief">' +
    '<a class="goapply" href="' + esc(target) + '" target="_blank" rel="noopener">Open application ↗</a>' +
    '<div class="noframe">this site refuses embedding — the form opens in a new tab</div>' +
    '<div class="tiles">' +
      cell("salary", esc(f.salary || j.salary || ""), (f.salary || j.salary) ? "yes" : "dim") +
      cell("remote", esc(f.remote || ""), "") +
      cell("portugal", esc(pt[0]), pt[1]) +
      cell("years", esc(f.years_experience || (j.xp || "").replace(/y$/, "")), "") +
      cell(dd === 1 ? "day" : "days", dd === null ? "" : String(dd), "") +
    "</div>";
  if (f.must_haves && f.must_haves.length)
    h += "<h3>Hard requirements</h3><ul>" + f.must_haves.map(m => "<li>" + esc(m) + "</li>").join("") + "</ul>";
  if (JDS === null) {
    JDS = {};
    fetch("data/jds.json?t=" + Date.now()).then(r => r.json()).then(d => {
      JDS = d.jobs || {}; PV = null; renderPreview();
    }).catch(() => {});
    h += "<h3>Posting</h3><div class='jd'>loading…</div>";
  } else if (JDS[j.id] && JDS[j.id].jd) {
    h += "<h3>Posting</h3><div class='jd'>" + esc(JDS[j.id].jd) + "</div>";
  }
  h += "</div>";
  body.innerHTML = h;
}
function cell(label, value, cls) {
  return '<span class="cell"><i>' + label + "</i><b" + (cls ? ' class="' + cls + '"' : "") + ">" +
         (value || "—") + "</b></span>";
}
function ptSituation(j, f) {
  if ((f.portugal || "").toLowerCase() === "yes") return ["Yes", "yes"];
  if ((f.portugal || "").toLowerCase() === "no") return ["No", "no"];
  const b = bucketOf(j);
  if (b === "pt") return ["Yes — named", "yes"];
  if (b === "ok") return ["Yes — you OK’d", "yes"];
  if (b === "eu") return ["Likely — " + (j.market || "Europe"), "yes"];
  if (b === "ww") return ["Likely — worldwide", "yes"];
  return ["Unclear", "dim"];
}
function card(j, opts) {
  const st = state.jobs[j.id] || "";
  const b = bucketOf(j);
  const f = (FACTS && FACTS[j.id]) || {};
  const el = document.createElement("div");
  el.className = "job" + (SEL === j.id ? " sel" : "");
  el.onclick = e => { if (!e.target.closest("a,button")) selectJob(j.id); };
  const dd = days(j);
  const remote = f.remote || (/hybrid/i.test(j.location) ? "Hybrid" : (j.direct === false || j.apply_url || /remote/i.test(j.location) || j.market ? "Remote" : ""));
  const years = f.years_experience || (j.xp ? j.xp.replace(/y$/, "") : "");
  const pt = ptSituation(j, f);
  const salary = f.salary || j.salary;
  el.innerHTML =
    '<div class="jmain">' +
      '<div class="jrow1">' +
        '<a class="jtitle" href="' + esc(safeUrl(j.apply_url || j.url)) + '" target="_blank" rel="noopener">' + esc(j.title) + "</a>" +
        (opts.isNew ? ' <span class="badge b-new">new</span>' : "") +
        (b === "pt" ? ' <span class="badge b-pt">PT</span>' : "") +
        (b === "ok" ? ' <span class="badge b-ok">ok’d</span>' : "") +
        '<span class="co">' + esc(j.company) + "</span>" +
        '<span class="hq" title="' + esc(j.location) + '">' + esc(f.country || j.location || "") + "</span>" +
        (salary ? '<span class="sal">' + esc(salary) + "</span>" : "") +
      "</div>" +
      '<div class="jrow2">' +
        cell(dd === 1 ? "day" : "days", dd === null ? "" : String(dd), dd === 0 ? "today" : "") +
        cell("remote", esc(remote), "") +
        cell("portugal", esc(pt[0]), pt[1]) +
        cell("years", esc(years), years ? "" : "dim") +
        cell("via", esc(j.source.split("/")[0]) + (j.apply_url ? (j.apply_kind === "careers" ? " → careers" : " → direct") : ""), "dim") +
      "</div>" +
    "</div>" +
    '<div class="jacts">' + (
      opts.done
        ? '<button class="restore">restore</button>'
        : '<button class="applied">applied</button><button class="discard">discard</button>'
    ) + "</div>";
  const on = (cls, fn) => { const b2 = el.querySelector(cls); if (b2) b2.onclick = fn; };
  on(".applied", () => { state.jobs[j.id] = "applied"; save(); scheduleState(); render(); });
  on(".discard", () => { state.jobs[j.id] = "discarded"; save(); scheduleState(); render(); });
  on(".restore", () => { delete state.jobs[j.id]; save(); scheduleState(); render(); });
  return el;
}

// ---------- render ----------
function section(root, label, jobs, opts) {
  if (!jobs.length) return;
  const h = document.createElement("h2");
  h.innerHTML = esc(label) + ' <span class="n">' + jobs.length + "</span>";
  root.appendChild(h);
  jobs.forEach(j => root.appendChild(card(j, Object.assign({ isNew: j.first_run === DATA.run_id }, opts))));
}
function render() {
  const root = document.getElementById("sections");
  root.innerHTML = "";
  const bydate = (a, b2) => when(b2) - when(a);
  const act = DATA.jobs.filter(j => j.active).sort(bydate);
  const inbox = act.filter(j => !state.jobs[j.id]);
  const split = w => {
    const pool = inbox.filter(j => !!j.direct === w);
    return {
      fresh: pool.filter(j => j.first_run === DATA.run_id),
      rest: pool.filter(j => j.first_run !== DATA.run_id),
    };
  };
  const D = split(true), I = split(false);
  const applied = act.filter(j => state.jobs[j.id] === "applied");
  const discarded = act.filter(j => state.jobs[j.id] === "discarded");

  document.getElementById("c-direct").textContent = D.fresh.length + D.rest.length || "";
  document.getElementById("c-indirect").textContent = I.fresh.length + I.rest.length || "";
  document.getElementById("c-applied").textContent = applied.length || "";
  document.getElementById("c-discarded").textContent = discarded.length || "";

  const visible = (tab === "direct" ? [...D.fresh, ...D.rest]
                  : tab === "indirect" ? [...I.fresh, ...I.rest]
                  : tab === "applied" ? applied : discarded);
  if (!visible.some(j => j.id === SEL)) SEL = visible.length ? visible[0].id : null;
  if (tab === "direct" || tab === "indirect") {
    const S = tab === "direct" ? D : I;
    section(root, "New overnight", S.fresh, {});
    section(root, "Active", S.rest, {});
    if (!S.fresh.length && !S.rest.length)
      root.innerHTML = '<div class="empty">' + (tab === "direct"
        ? "No direct roles match." : "Nothing here — every find has a source link.") + "</div>";
  } else if (tab === "applied") {
    section(root, "Applied", applied, { done: true });
    if (!applied.length) root.innerHTML = '<div class="empty">Nothing applied yet.</div>';
  } else {
    section(root, "Discarded", discarded, { done: true });
    if (!discarded.length) root.innerHTML = '<div class="empty">Nothing discarded.</div>';
  }

  renderPreview();
  const s = DATA.sources || {};
  const bad = Object.keys(s).filter(k => !s[k].ok);
  document.getElementById("foot").innerHTML =
    Object.keys(s).length + " sources · " + DATA.counts.active + " active roles · " +
    (DATA.counts.new ? DATA.counts.new + " new overnight" : "no new overnight") +
    (bad.length ? ' · <span class="bad">down: ' + bad.map(esc).join(", ") + "</span>" : "");
}
function stamp() {
  const t = new Date(DATA.generated_at);
  document.getElementById("stamp").textContent =
    "updated " + t.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

// ---------- wiring ----------
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("scrape").onclick = scrapeNow;
document.getElementById("gear").onclick = () => document.getElementById("settings").classList.toggle("open");
document.getElementById("savetok").onclick = () => {
  state.token = document.getElementById("tok").value.trim();
  save(); setSyncMsg(state.token ? "token saved" : "token cleared");
};
if (state.token) document.getElementById("tok").value = state.token;

fetch("data/state.json?t=" + Date.now()).then(r => r.ok ? r.text() : null).then(t => {
  REPO_STATE = t;
  if (t) {
    try {
      const repo = JSON.parse(t).jobs || {};
      let changed = false;
      for (const id in repo) if (!(id in state.jobs)) { state.jobs[id] = repo[id]; changed = true; }
      if (changed) { save(); if (DATA) render(); }
    } catch (e) {}
  }
  scheduleState();
}).catch(() => {});
fetch("data/facts.json?t=" + Date.now()).then(r => r.ok ? r.json() : {}).then(f => {
  FACTS = f || {}; if (DATA) render();
}).catch(() => {});
fetch("data/jobs.json?t=" + Date.now()).then(r => r.json()).then(d => {
  DATA = d; stamp(); render();
}).catch(() => {
  document.getElementById("stamp").textContent = "couldn't load data/jobs.json — run scrape.py first";
});
</script>
</body>
</html>
